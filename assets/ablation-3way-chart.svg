<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" role="img" aria-label="201 轮长对话上下文标签误触降噪对照（N=3）">
  <defs>
    <linearGradient id="barGray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Outer Card (GitHub Light & Dark Mode Safe) -->
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">
    201 轮长对话存档 · 3 场景（N=3）标签误触降噪对照实测
  </text>
  <text x="32" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">
    同存档（84 条结构化知识库条目 + 14,004 字状态表）· 同模型 · 覆盖 S1 常规业务 / S2 纯情绪 / S3 点名旧条目召回边界
  </text>
  <line x1="32" y1="74" x2="888" y2="74" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Panel: Prompt Tokens Comparison -->
  <rect x="32" y="90" width="516" height="272" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    单轮平均 Prompt Tokens 负载
  </text>
  <text x="50" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#64748b">
    数据源：05-rp-narrative-and-ablation/real-ablation-results.json
  </text>

  <!-- Group A -->
  <text x="50" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#334155">
    组 A · 原生思考（无前置过滤 · 误触注入 41 条知识库）
  </text>
  <rect x="50" y="175" width="380" height="26" rx="5" fill="url(#barGray)"/>
  <text x="438" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#334155">
    132,843 tok
  </text>
  <text x="50" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">
    S1: 132,851（夹带 2,400+ 字旧 HTML） | S2: 132,834 | S3: 132,843
  </text>

  <!-- Group B -->
  <text x="50" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#334155">
    组 B · 非原生 + 常规 4 维 CoT（无过滤 · 41 条知识库稀释指令）
  </text>
  <rect x="50" y="251" width="381" height="26" rx="5" fill="url(#barAmber)"/>
  <text x="439" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#b45309">
    133,033 tok
  </text>
  <text x="50" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#b45309">
    S1: 133,060 | S2: 133,015 | S3: 133,024 — 3 场景思考标签遵循 0/3
  </text>

  <!-- Group C -->
  <text x="50" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">
    组 C · 前置标签过滤 + 状态折叠 + 短 CoT（仅注入 10~12 条）
  </text>
  <rect x="50" y="327" width="43" height="26" rx="5" fill="url(#barBlue)"/>
  <text x="101" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="800" fill="#1d4ed8">
    14,972 tok
  </text>
  <rect x="184" y="328" width="114" height="24" rx="12" fill="#dbeafe"/>
  <text x="241" y="344" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#1e40af">
    降噪 -88.7%
  </text>
  <text x="308" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#334155">
    S1: 14,469 | S2: 14,453 | S3: 15,993
  </text>

  <!-- Right Panel: Quality, Noise Filtering & True-Positive Recall -->
  <rect x="564" y="90" width="324" height="272" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="582" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    格式遵循与召回边界观测
  </text>

  <!-- Metric Card 1 -->
  <rect x="582" y="132" width="288" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="596" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#475569">
    思考标签指令遵循（S1 / S2 / S3）
  </text>
  <text x="596" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#dc2626">
    组 B: 0 / 3
  </text>
  <text x="690" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#94a3b8">
    →
  </text>
  <text x="716" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="800" fill="#15803d">
    组 C: 3 / 3
  </text>

  <!-- Metric Card 2 -->
  <rect x="582" y="208" width="288" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="596" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#475569">
    单轮误触发与递归条目过滤
  </text>
  <text x="596" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">
    拦下 29 ~ 31 条无关条目（41 → 10/12 条）
  </text>
  <text x="596" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#64748b">
    状态表同步按近期提及折叠 16 项（14,004 → 8,458 字）
  </text>

  <!-- Metric Card 3 -->
  <rect x="582" y="284" width="288" height="66" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="596" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#166534">
    S3 召回边界抽检：显式点名旧条目
  </text>
  <text x="596" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#15803d">
    PASS · 目标条目正常放行并写入回复
  </text>
  <text x="596" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#166534">
    确认降噪来自前置标签过滤，未误杀正常点名召回
  </text>
</svg>
